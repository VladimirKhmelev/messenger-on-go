volumes:
  auth-db-data:
  chat-db-data:
  redis-data:
  nats-data:
  vmdata:
  grafanadata:
  minio-data:
  media-db-data:

services:
  auth-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  chat-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5433:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  media-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media
      POSTGRES_DB: media
    ports:
      - "5434:5432"
    volumes:
      - media-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/"]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    # На проде за 12 дней разрослось до 2 Гб, вынудив хост использовать swap
    # Лимит в 512 мб обеспечивает запас в несколько дней.
    mem_limit: 512m
    cpus: 0.5
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.125.0
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    volumes:
      - vmdata:/storage
      - ./metrics/promscrape.yml:/etc/promscrape.yml:ro
    command:
      - "--storageDataPath=/storage"
      - "--httpListenAddr=:8428"
      - "--promscrape.config=/etc/promscrape.yml"
    ports:
      - "127.0.0.1:8428:8428"

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      - victoriametrics
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      network: host
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "50051:50051"
      - "8082:8080"
    environment:
      GRPC_PORT: "50051"
      HTTP_PORT: "8080"
      POSTGRES_DSN: postgres://auth:auth@auth-db:5432/auth?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Локально используем MailHog, в проде - реальный SMTP сервер
      ## Переопредите переменные окружения в .env файле для прода
      SMTP_ADDR: ${SMTP_ADDR:-mailhog:1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@messenger-on-go.local}
      SMTP_DISPLAY_NAME: ${SMTP_DISPLAY_NAME:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      mailhog:
        condition: service_started
      jaeger:
        condition: service_started

  chat-service:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
      network: host
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "50052:50051"
      - "8083:8080"
    environment:
      GRPC_PORT: "50051"
      HTTP_PORT: "8080"
      POSTGRES_DSN: postgres://chat:chat@chat-db:5432/chat?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      AUTH_SERVICE_ADDR: auth-service:50051
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
    depends_on:
      chat-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      auth-service:
        condition: service_healthy
      jaeger:
        condition: service_started

  ws-gateway-1:
    build:
      context: .
      dockerfile: services/ws-gateway/Dockerfile
      network: host
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "8080:8080"
    environment:
      GRPC_PORT: "50051"
      HTTP_PORT: "8080"
      NATS_URL: nats://nats:4222
      CHAT_SERVICE_ADDR: chat-service:50051
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      # Пустое значение позволяет любому Origin (локальная разработка). Установите для продакшена, например https://wisply.site
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
    depends_on:
      nats:
        condition: service_started
      chat-service:
        condition: service_healthy
      jaeger:
        condition: service_started

  ws-gateway-2:
    build:
      context: .
      dockerfile: services/ws-gateway/Dockerfile
      network: host
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "8081:8080"
    environment:
      GRPC_PORT: "50051"
      HTTP_PORT: "8080"
      NATS_URL: nats://nats:4222
      CHAT_SERVICE_ADDR: chat-service:50051
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      # Empty allows any Origin (local dev). Set for prod, e.g. https://wisply.site
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
    depends_on:
      nats:
        condition: service_started
      chat-service:
        condition: service_healthy
      jaeger:
        condition: service_started

  notification-worker:
    build:
      context: .
      dockerfile: services/notification-worker/Dockerfile
      network: host
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    environment:
      GRPC_PORT: "50051"
      METRICS_PORT: "9090"
      NATS_URL: nats://nats:4222
      CHAT_SERVICE_ADDR: chat-service:50051
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
    depends_on:
      nats:
        condition: service_started
      chat-service:
        condition: service_healthy
      jaeger:
        condition: service_started

  media-service:
    build:
      context: .
      dockerfile: services/media-service/Dockerfile
      network: host
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "50053:50051"
      - "8084:8080"
    environment:
      GRPC_PORT: "50051"
      HTTP_PORT: "8080"
      POSTGRES_DSN: postgres://media:media@media-db:5432/media?sslmode=disable
      CHAT_SERVICE_ADDR: chat-service:50051
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      PUBLIC_MEDIA_URL: ${PUBLIC_MEDIA_URL:-https://localhost:8443/messenger-media}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-jaeger:4317}
    healthcheck:
      test: ["CMD", "/grpc-health-probe", "-addr=:50051"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      media-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      jaeger:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8090}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ${NGINX_CONF:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      # Локально используем самоподписанные сертификаты, в проде - реальные сертификаты от Let's Encrypt
      # Продакшен: установите certbot и запустите его в контейнере nginx, чтобы получить сертификаты для вашего домена.
      - ./nginx/certs:/etc/nginx/certs:ro
      - ${LETSENCRYPT_DIR:-./nginx/certs}:/etc/letsencrypt:ro
    depends_on:
      auth-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      ws-gateway-1:
        condition: service_started
      ws-gateway-2:
        condition: service_started
      minio:
        condition: service_healthy
      media-service:
        condition: service_healthy

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    command: ["server", "/data", "--console-address", ":9091"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "127.0.0.1:9091:9091"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5