volumes:
  auth-db-data:
  chat-db-data:
  redis-data:
  nats-data:

services:
  auth-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  chat-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5433:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
    ports:
      - "4222:4222"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      network: host
    restart: unless-stopped
    ports:
      - "50051:50051"
      - "8082:8080"
    environment:
      GRPC_PORT: "50051"
      HTTP_PORT: "8080"
      POSTGRES_DSN: postgres://auth:auth@auth-db:5432/auth?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Локально используем MailHog, в проде - реальный SMTP сервер
      ## Переопредите переменные окружения в .env файле для прода
      SMTP_ADDR: ${SMTP_ADDR:-mailhog:1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@messenger-on-go.local}
      SMTP_DISPLAY_NAME: ${SMTP_DISPLAY_NAME:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      mailhog:
        condition: service_started

  chat-service:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
      network: host
    restart: unless-stopped
    ports:
      - "50052:50051"
      - "8083:8080"
    environment:
      GRPC_PORT: "50051"
      HTTP_PORT: "8080"
      POSTGRES_DSN: postgres://chat:chat@chat-db:5432/chat?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      AUTH_SERVICE_ADDR: auth-service:50051
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
    depends_on:
      chat-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      auth-service:
        condition: service_healthy

  ws-gateway-1:
    build:
      context: .
      dockerfile: services/ws-gateway/Dockerfile
      network: host
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GRPC_PORT: "50051"
      HTTP_PORT: "8080"
      NATS_URL: nats://nats:4222
      CHAT_SERVICE_ADDR: chat-service:50051
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      # Пустое значение позволяет любому Origin (локальная разработка). Установите для продакшена, например https://wisply.site
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      nats:
        condition: service_started
      chat-service:
        condition: service_healthy

  ws-gateway-2:
    build:
      context: .
      dockerfile: services/ws-gateway/Dockerfile
      network: host
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      GRPC_PORT: "50051"
      HTTP_PORT: "8080"
      NATS_URL: nats://nats:4222
      CHAT_SERVICE_ADDR: chat-service:50051
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      # Empty allows any Origin (local dev). Set for prod, e.g. https://wisply.site
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      nats:
        condition: service_started
      chat-service:
        condition: service_healthy

  notification-worker:
    build:
      context: .
      dockerfile: services/notification-worker/Dockerfile
      network: host
    restart: unless-stopped
    environment:
      GRPC_PORT: "50051"
      NATS_URL: nats://nats:4222
      CHAT_SERVICE_ADDR: chat-service:50051
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
    depends_on:
      nats:
        condition: service_started
      chat-service:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8090}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ${NGINX_CONF:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      # Локально используем самоподписанные сертификаты, в проде - реальные сертификаты от Let's Encrypt
      # Продакшен: установите certbot и запустите его в контейнере nginx, чтобы получить сертификаты для вашего домена.
      - ./nginx/certs:/etc/nginx/certs:ro
      - ${LETSENCRYPT_DIR:-./nginx/certs}:/etc/letsencrypt:ro
    depends_on:
      auth-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      ws-gateway-1:
        condition: service_started
      ws-gateway-2:
        condition: service_started
