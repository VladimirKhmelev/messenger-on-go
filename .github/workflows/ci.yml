name: CI

on:
  push:
  pull_request:

env:
  GO_VERSION: "1.26.8"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.list }}
      auth-service: ${{ steps.filter.outputs.auth-service }}
      chat-service: ${{ steps.filter.outputs.chat-service }}
      proto: ${{ steps.filter.outputs.proto }}
      pkg-jwtutil: ${{ steps.filter.outputs.pkg-jwtutil }}
      pkg-metrics: ${{ steps.filter.outputs.pkg-metrics }}
      pkg-tracing: ${{ steps.filter.outputs.pkg-tracing }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # every Go service builds against these, so a change here
            # re-tests all of them
            shared: &shared
              - 'pkg/**'
              - 'proto/**'
              - 'go.work'
              - 'go.work.sum'
              - '.github/workflows/ci.yml'
            auth-service:
              - *shared
              - 'services/auth-service/**'
            chat-service:
              - *shared
              - 'services/chat-service/**'
            ws-gateway:
              - *shared
              - 'services/ws-gateway/**'
            notification-worker:
              - *shared
              - 'services/notification-worker/**'
            media-service:
              - *shared
              - 'services/media-service/**'
            proto:
              - 'proto/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            pkg-jwtutil:
              - 'pkg/jwtutil/**'
              - '.github/workflows/ci.yml'
            pkg-metrics:
              - 'pkg/metrics/**'
              - '.github/workflows/ci.yml'
            pkg-tracing:
              - 'pkg/tracing/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
      - name: Collect changed services
        id: services
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          list=$(jq -c '[.[] | select(IN("auth-service", "chat-service", "ws-gateway", "notification-worker", "media-service"))]' <<< "$CHANGED")
          echo "changed services: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  proto-lint:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/auth-service/go.sum
      - name: Install protolint
        run: go install github.com/yoheimuta/protolint/cmd/protolint@v0.53.0
      - name: Run protolint
        run: protolint lint proto/auth/v1/auth.proto proto/chat/v1/chat.proto proto/media/v1/media.proto

  swagger:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/auth-service/go.sum
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc-gen-go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@latest
      - name: Generate OpenAPI spec
        run: make proto
      - name: Validate OpenAPI spec has expected paths
        run: |
          python3 -c "
          import json
          with open('proto/gen/openapi/messenger.swagger.json') as f:
              spec = json.load(f)
          paths = spec.get('paths', {})
          required = ['/v1/auth/register', '/v1/auth/login', '/v1/chats', '/v1/media/uploads']
          for p in required:
              assert p in paths, f'missing path: {p}'
          print('swagger spec OK, paths:', list(paths.keys()))
          "
      - name: Upload swagger docs
        uses: actions/upload-artifact@v4
        with:
          name: swagger-docs
          path: proto/gen/openapi/messenger.swagger.json

  service:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Check gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Check go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: services/${{ matrix.service }}

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
        continue-on-error: true

      - run: go build ./...

      - name: Run tests with coverage
        run: go test -race ./... -cover -coverprofile=cover.out
      - name: Generate HTML coverage report
        run: go tool cover -html=cover.out -o cover.html
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/cover.html

  pkg-jwtutil:
    needs: changes
    if: needs.changes.outputs.pkg-jwtutil == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg/jwtutil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: pkg/jwtutil/go.sum

      - name: Check gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Check go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: pkg/jwtutil

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
        continue-on-error: true

      - run: go build ./...
      - run: go test -race ./... -cover

  pkg-metrics:
    needs: changes
    if: needs.changes.outputs.pkg-metrics == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg/metrics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: pkg/metrics/go.sum

      - name: Check gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Check go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: pkg/metrics

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
        continue-on-error: true

      - run: go build ./...
      - run: go test -race ./... -cover

  pkg-tracing:
    needs: changes
    if: needs.changes.outputs.pkg-tracing == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg/tracing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: pkg/tracing/go.sum

      - name: Check gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Check go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: pkg/tracing

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
        continue-on-error: true

      - run: go build ./...
      - run: go test -race ./... -cover

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JS syntax
        run: |
          for f in $(find frontend -name '*.js'); do
            node --input-type=module --check < "$f"
          done

  auth-service-integration:
    needs: changes
    if: needs.changes.outputs.auth-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/auth-service/go.sum
      - name: Run integration tests
        run: go test -tags=integration ./... -v

  chat-service-integration:
    needs: changes
    if: needs.changes.outputs.chat-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chat-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/chat-service/go.sum
      - name: Run integration tests
        run: go test -tags=integration ./... -v
