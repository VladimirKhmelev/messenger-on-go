syntax = "proto3";

package media.v1;

import "google/api/annotations.proto";

option go_package = "github.com/VladimirKhmelev/messenger-on-go/proto/gen"
    "/media/v1;mediav1";

service MediaService {
  rpc Health(HealthRequest) returns (HealthResponse) {
    option (google.api.http) = {
      get: "/v1/media/health"
    };
  }

  rpc RequestUpload(RequestUploadRequest) returns (RequestUploadResponse) {
    option (google.api.http) = {
      post: "/v1/media/uploads"
      body: "*"
    };
  }

  rpc ConfirmUpload(ConfirmUploadRequest)
      returns (ConfirmUploadResponse) {
    option (google.api.http) = {
      post: "/v1/media/uploads/{upload_id}/confirm"
      body: "*"
    };
  }

  rpc GetDownloadURL(GetDownloadURLRequest)
      returns (GetDownloadURLResponse) {
    option (google.api.http) = {
      get: "/v1/media/{media_id}/download-url"
    };
  }
}

message HealthRequest {
}

message HealthResponse {
  bool ok = 1;
}

message RequestUploadRequest {
  string chat_id = 1;
  string content_type = 2;
  int64 size_bytes = 3;
}

message RequestUploadResponse {
  string upload_id = 1;
  string upload_url = 2;
  int64 expires_at_unix = 3;
}

message ConfirmUploadRequest {
  string upload_id = 1;
}

message ConfirmUploadResponse {
  string media_id = 1;
}

message GetDownloadURLRequest {
  string media_id = 1;
}

message GetDownloadURLResponse {
  string download_url = 1;
  int64 expires_at_unix = 2;
}
