syntax = "proto3";

package auth.v1;

import "google/api/annotations.proto";

option go_package = "github.com/VladimirKhmelev/messenger-on-go/proto/gen"
    "/auth/v1;authv1";

service AuthService {
  rpc Health(HealthRequest) returns (HealthResponse) {
    option (google.api.http) = {
      get: "/v1/auth/health"
    };
  }

  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
  }

  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }

  rpc GetUserByTag(GetUserByTagRequest) returns (GetUserByTagResponse) {
    option (google.api.http) = {
      get: "/v1/users/by-tag/{tag}"
    };
  }

  rpc GetUserByID(GetUserByIDRequest) returns (GetUserByIDResponse) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}"
    };
  }

  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users"
    };
  }

  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/v1/auth/refresh"
      body: "*"
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
  }

  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {
    option (google.api.http) = {
      post: "/v1/auth/verify-email"
      body: "*"
    };
  }

  rpc RequestPasswordReset(RequestPasswordResetRequest)
      returns (RequestPasswordResetResponse) {
    option (google.api.http) = {
      post: "/v1/auth/password-reset/request"
      body: "*"
    };
  }

  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (google.api.http) = {
      post: "/v1/auth/password-reset/confirm"
      body: "*"
    };
  }

  rpc LoginWithGitHub(LoginWithGitHubRequest)
      returns (LoginWithGitHubResponse) {
    option (google.api.http) = {
      post: "/v1/auth/github"
      body: "*"
    };
  }

  rpc UpdateTag(UpdateTagRequest) returns (UpdateTagResponse) {
    option (google.api.http) = {
      patch: "/v1/users/me/tag"
      body: "*"
    };
  }

  rpc CheckTagAvailable(CheckTagAvailableRequest)
      returns (CheckTagAvailableResponse) {
    option (google.api.http) = {
      get: "/v1/users/tag-available/{tag}"
    };
  }

  rpc UpdateDisplayName(UpdateDisplayNameRequest)
      returns (UpdateDisplayNameResponse) {
    option (google.api.http) = {
      patch: "/v1/users/me/display-name"
      body: "*"
    };
  }

  rpc ChangePassword(ChangePasswordRequest)
      returns (ChangePasswordResponse) {
    option (google.api.http) = {
      post: "/v1/users/me/password"
      body: "*"
    };
  }
}

message HealthRequest {
}

message HealthResponse {
  bool ok = 1;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string tag = 3;
  string display_name = 4;
}

message RegisterResponse {
  string user_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message GetUserByTagRequest {
  string tag = 1;
}

message GetUserByTagResponse {
  string user_id = 1;
  string email = 2;
  string tag = 3;
  string display_name = 4;
}

message GetUserByIDRequest {
  string user_id = 1;
}

message GetUserByIDResponse {
  string user_id = 1;
  string email = 2;
  string tag = 3;
  string display_name = 4;
}

message SearchUsersRequest {
  string query = 1;
}

message SearchUsersResponse {
  repeated UserSummary users = 1;
}

message UserSummary {
  string user_id = 1;
  string email = 2;
  string tag = 3;
  string display_name = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
}

message VerifyEmailRequest {
  string email = 1;
  string code = 2;
}

message VerifyEmailResponse {
}

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {
}

message LoginWithGitHubRequest {
  string code = 1;
}

message LoginWithGitHubResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message UpdateTagRequest {
  string tag = 1;
}

message UpdateTagResponse {
  string tag = 1;
}

message CheckTagAvailableRequest {
  string tag = 1;
}

message CheckTagAvailableResponse {
  bool available = 1;
  // Populated only when available is false: an unused suggestion derived
  // from the requested tag (same base + random digits), so the client can
  // offer a one-click alternative instead of a dead end.
  string suggested_tag = 2;
}

message UpdateDisplayNameRequest {
  string display_name = 1;
}

message UpdateDisplayNameResponse {
  string display_name = 1;
}

message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {
}
