syntax = "proto3";

package chat.v1;

import "google/api/annotations.proto";

option go_package = "github.com/VladimirKhmelev/messenger-on-go/proto/gen"
    "/chat/v1;chatv1";

service ChatService {
  rpc Health(HealthRequest) returns (HealthResponse) {
    option (google.api.http) = {
      get: "/v1/chat/health"
    };
  }

  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse) {
    option (google.api.http) = {
      post: "/v1/chats"
      body: "*"
    };
  }

  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse) {
    option (google.api.http) = {
      post: "/v1/chats/{chat_id}/messages"
      body: "*"
    };
  }

  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse) {
    option (google.api.http) = {
      get: "/v1/chats/{chat_id}/messages"
    };
  }

  rpc ListChats(ListChatsRequest) returns (ListChatsResponse) {
    option (google.api.http) = {
      get: "/v1/chats"
    };
  }

  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse) {
    option (google.api.http) = {
      patch: "/v1/chats/{chat_id}/messages/{message_id}"
      body: "*"
    };
  }

  rpc DeleteMessageForAll(DeleteMessageForAllRequest)
      returns (DeleteMessageForAllResponse) {
    option (google.api.http) = {
      delete: "/v1/chats/{chat_id}/messages/{message_id}"
    };
  }

  rpc DeleteMessageForMe(DeleteMessageForMeRequest)
      returns (DeleteMessageForMeResponse) {
    option (google.api.http) = {
      delete: "/v1/chats/{chat_id}/messages/{message_id}/for-me"
    };
  }

  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse);
  rpc GetPresence(GetPresenceRequest) returns (GetPresenceResponse);
  rpc SetOnline(SetOnlineRequest) returns (SetOnlineResponse);
  rpc SetOffline(SetOfflineRequest) returns (SetOfflineResponse);
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
  rpc SetTyping(SetTypingRequest) returns (SetTypingResponse);
  rpc GetTyping(GetTypingRequest) returns (GetTypingResponse);

  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse) {
    option (google.api.http) = {
      post: "/v1/chats/{chat_id}/read"
      body: "*"
    };
  }
  rpc GetReadStatus(GetReadStatusRequest) returns (GetReadStatusResponse);

  rpc GetChatKey(GetChatKeyRequest) returns (GetChatKeyResponse) {
    option (google.api.http) = {
      get: "/v1/chats/{chat_id}/key"
    };
  }

  rpc ListChatKeys(ListChatKeysRequest) returns (ListChatKeysResponse) {
    option (google.api.http) = {
      get: "/v1/chats/{chat_id}/keys"
    };
  }

  rpc UpdateChatKey(UpdateChatKeyRequest) returns (UpdateChatKeyResponse) {
    option (google.api.http) = {
      put: "/v1/chats/{chat_id}/keys/{user_id}"
      body: "*"
    };
  }
}

message HealthRequest {
}

message HealthResponse {
  bool ok = 1;
}

message CreateChatRequest {
  string target_user_id = 1;
  map<string, string> encrypted_chat_key = 2;
  map<string, string> wrapped_for_public_key = 3;
}

message CreateChatResponse {
  string chat_id = 1;
}

message SendMessageRequest {
  string chat_id = 1;
  string text = 2;
}

message SendMessageResponse {
  string message_id = 1;
}

message GetHistoryRequest {
  string chat_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetHistoryResponse {
  repeated Message messages = 1;
}

message Message {
  string message_id = 1;
  string sender_user_id = 2;
  string text = 3;
  int64 created_at_unix = 4;
  int64 edited_at_unix = 5;
  bool deleted = 6;
}

message EditMessageRequest {
  string chat_id = 1;
  string message_id = 2;
  string text = 3;
}

message EditMessageResponse {
  Message message = 1;
}

message DeleteMessageForAllRequest {
  string chat_id = 1;
  string message_id = 2;
}

message DeleteMessageForAllResponse {
}

message DeleteMessageForMeRequest {
  string chat_id = 1;
  string message_id = 2;
}

message DeleteMessageForMeResponse {
}

message ListChatsRequest {
}

message ListChatsResponse {
  repeated ChatSummary chats = 1;
}

message ChatSummary {
  string chat_id = 1;
  repeated string member_user_ids = 2;
  Message last_message = 3;
}

message ListMembersRequest {
  string chat_id = 1;
}

message ListMembersResponse {
  repeated string user_ids = 1;
}

message GetMessageRequest {
  string message_id = 1;
}

message GetMessageResponse {
  Message message = 1;
}

message GetPresenceRequest {
  string user_id = 1;
}

message GetPresenceResponse {
  bool online = 1;
  int64 last_seen_unix = 2;
}

message SetOnlineRequest {
  string user_id = 1;
}

message SetOnlineResponse {
}

message SetOfflineRequest {
  string user_id = 1;
}

message SetOfflineResponse {
}

message ListContactsRequest {
  string user_id = 1;
}

message ListContactsResponse {
  repeated string user_ids = 1;
}

message SetTypingRequest {
  string chat_id = 1;
  string user_id = 2;
}

message SetTypingResponse {
}

message GetTypingRequest {
  string chat_id = 1;
  string user_id = 2;
}

message GetTypingResponse {
  bool typing = 1;
}

message MarkReadRequest {
  string chat_id = 1;
  string message_id = 2;
}

message MarkReadResponse {
}

message GetReadStatusRequest {
  string chat_id = 1;
  string user_id = 2;
}

message GetReadStatusResponse {
  string last_read_message_id = 1;
}

message GetChatKeyRequest {
  string chat_id = 1;
}

message GetChatKeyResponse {
  string encrypted_chat_key = 1;
}

message ListChatKeysRequest {
  string chat_id = 1;
}

message MemberChatKey {
  string user_id = 1;
  string encrypted_chat_key = 2;
  string wrapped_for_public_key = 3;
}

message ListChatKeysResponse {
  repeated MemberChatKey member_keys = 1;
}

message UpdateChatKeyRequest {
  string chat_id = 1;
  string user_id = 2;
  string encrypted_chat_key = 3;
  string wrapped_for_public_key = 4;
}

message UpdateChatKeyResponse {
}
